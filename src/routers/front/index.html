<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天室 - LotCom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass-effect {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-bg {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
        }
        .message-bubble {
            max-width: 70%;
            word-wrap: break-word;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-in {
            animation: slideIn 0.3s ease-out;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(2); opacity: 0; }
        }
        .online-indicator::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #10b981;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen">
    <div id="app" class="h-screen flex flex-col">
        <!-- 顶部导航 -->
        <header class="glass-effect border-b border-white/10 px-6 py-4 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-500 rounded-full flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-white font-semibold text-lg">LotCom 聊天室</h1>
                    <div class="flex items-center gap-2 text-xs text-white/60">
                        <span class="relative flex h-2 w-2">
                            <span class="online-indicator absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                        </span>
                        <span>在线</span>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <div class="text-white font-medium">{{ currentUser }}</div>
                    <div class="text-white/50 text-xs">学号: {{ studentId }}</div>
                </div>
                <button @click="logout" class="p-2 hover:bg-white/10 rounded-lg transition-colors" title="退出登录">
                    <svg class="w-5 h-5 text-white/70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- 消息区域 -->
        <main class="flex-1 overflow-hidden relative">
            <div ref="messageContainer" class="h-full overflow-y-auto p-6 space-y-4 scrollbar-hide">
                <!-- 加载历史消息 -->
                <div v-if="loading" class="flex justify-center py-4">
                    <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-white"></div>
                </div>

                <!-- 消息列表 -->
                <div v-for="(msg, index) in messages" :key="index" 
                     class="animate-slide-in"
                     :class="msg.isSystem ? 'flex justify-center' : (msg.isMe ? 'flex justify-end' : 'flex justify-start')">
                    
                    <!-- 系统消息 -->
                    <div v-if="msg.isSystem" class="px-4 py-2 rounded-full bg-white/10 text-white/70 text-sm">
                        {{ msg.content }}
                    </div>

                    <!-- 用户消息 -->
                    <div v-else class="flex gap-3 max-w-[80%]" :class="msg.isMe ? 'flex-row-reverse' : ''">
                        <!-- 头像 -->
                        <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold shrink-0"
                             :class="msg.isMe ? 'bg-indigo-500 text-white' : 'bg-white/20 text-white'">
                            {{ msg.sender.charAt(0).toUpperCase() }}
                        </div>
                        <div class="flex flex-col" :class="msg.isMe ? 'items-end' : 'items-start'">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-xs text-white/60">{{ msg.sender }}</span>
                                <span class="text-xs text-white/40">{{ msg.time }}</span>
                            </div>
                            <div class="message-bubble px-4 py-2.5 rounded-2xl text-sm"
                                 :class="msg.isMe ? 
                                     'bg-indigo-500 text-white rounded-br-md' : 
                                     'bg-white/10 text-white rounded-bl-md border border-white/10'">
                                {{ msg.content }}
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 空状态 -->
                <div v-if="messages.length === 0 && !loading" class="flex flex-col items-center justify-center h-full text-white/40">
                    <svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                    </svg>
                    <p>还没有消息，开始聊天吧！</p>
                </div>
            </div>
        </main>

        <!-- 输入区域 -->
        <footer class="glass-effect border-t border-white/10 p-4 shrink-0">
            <div class="max-w-4xl mx-auto flex gap-3">
                <div class="flex-1 relative">
                    <input 
                        v-model="newMessage" 
                        @keyup.enter="sendMessage"
                        type="text" 
                        placeholder="输入消息..." 
                        :disabled="!connected"
                        class="w-full px-5 py-3 pr-12 rounded-full bg-white/10 border border-white/20 text-white placeholder-white/40 focus:outline-none focus:border-indigo-500/50 focus:ring-2 focus:ring-indigo-500/20 transition-all disabled:opacity-50"
                    >
                    <button 
                        @click="sendMessage"
                        :disabled="!newMessage.trim() || !connected"
                        class="absolute right-2 top-1/2 -translate-y-1/2 p-2 bg-indigo-500 hover:bg-indigo-600 disabled:bg-white/10 disabled:cursor-not-allowed rounded-full transition-all"
                    >
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="text-center mt-2 text-xs" :class="connected ? 'text-emerald-400' : 'text-red-400'">
                {{ connectionStatus }}
            </div>
        </footer>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    socket: null,
                    messages: [],
                    newMessage: '',
                    currentUser: '',
                    studentId: '',
                    connected: false,
                    loading: true,
                    connectionStatus: '连接中...'
                }
            },
            mounted() {
                this.checkAuth();
                this.initSocket();
            },
            methods: {
                async checkAuth() {
                    try {
                        const response = await fetch('/api/me', { credentials: 'include' });
                        if (!response.ok) {
                            window.location.href = '/login';
                            return;
                        }
                        const data = await response.json();
                        this.currentUser = data.username;
                        this.studentId = data.studentid || '';
                    } catch (err) {
                        window.location.href = '/login';
                    }
                },
                initSocket() {
                    this.socket = io({
                        transports: ['websocket', 'polling'],
                        withCredentials: true
                    });

                    this.socket.on('connect', () => {
                        this.connected = true;
                        this.connectionStatus = '已连接';
                        this.loadHistory();
                    });

                    this.socket.on('disconnect', () => {
                        this.connected = false;
                        this.connectionStatus = '已断开，尝试重连...';
                    });

                    this.socket.on('connect_error', () => {
                        this.connected = false;
                        this.connectionStatus = '连接失败';
                    });

                    // 接收普通消息
                    this.socket.on('message', (data) => {
                        // 解析后端发送的格式 "(username): content"
                        const match = data.match(/^\((.+?)\): (.+)$/);
                        if (match) {
                            const [, sender, content] = match;
                            this.messages.push({
                                content: content,
                                sender: sender,
                                time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }),
                                isMe: sender === this.currentUser,
                                isSystem: false
                            });
                        } else {
                            // 系统消息格式
                            this.messages.push({
                                content: data,
                                isSystem: true
                            });
                        }
                        this.scrollToBottom();
                    });

                    // 用户加入通知
                    this.socket.on('joined', (data) => {
                        this.messages.push({
                            content: `${data.username} 加入了聊天室`,
                            isSystem: true
                        });
                        this.scrollToBottom();
                    });
                },
                async loadHistory() {
                    this.loading = true;
                    this.socket.emit('getMessages', (response) => {
                        this.loading = false;
                        if (response && response.messages) {
                            response.messages.forEach(msg => {
                                this.messages.push({
                                    id: msg.id,
                                    content: msg.content,
                                    sender: msg.sender,
                                    time: msg.create_time.split(' ')[1].substring(0, 5), // 只显示时分
                                    isMe: msg.sender === this.currentUser,
                                    isSystem: false
                                });
                            });
                            this.scrollToBottom();
                        }
                    });
                },
                sendMessage() {
                    const content = this.newMessage.trim();
                    if (!content || !this.connected) return;

                    // 本地立即显示（乐观更新）
                    this.messages.push({
                        content: content,
                        sender: this.currentUser,
                        time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }),
                        isMe: true,
                        isSystem: false
                    });
                    
                    this.socket.emit('message', content);
                    this.newMessage = '';
                    this.scrollToBottom();
                },
                scrollToBottom() {
                    this.$nextTick(() => {
                        const container = this.$refs.messageContainer;
                        if (container) {
                            container.scrollTop = container.scrollHeight;
                        }
                    });
                },
                async logout() {
                    try {
                        await fetch('/api/logout', { method: 'POST', credentials: 'include' });
                    } finally {
                        window.location.href = '/login';
                    }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
